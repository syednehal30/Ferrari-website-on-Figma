-serif" font-size="16" font-weight="600" fill="#665276">Researcher</text><text x="228" y="290" font-family="Arial,sans-serif" font-size="11" fill="#9d88ad">Evidence &amp; brief</text><path d="M534 252H545" stroke="#a69abf" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="381" y="190" width="151" height="130" rx="16" fill="white" stroke="#e0d6ee"/><rect x="396" y="205" width="31" height="27" rx="7" fill="#efe8fc"/><text x="411" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#8870b6">03</text><text x="396" y="260" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#665276">Outreach</text><text x="396" y="290" font-family="Arial,sans-serif" font-size="11" fill="#9d88ad">Secondary domain</text><path d="M702 252H713" stroke="#a69abf" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="549" y="190" width="151" height="130" rx="16" fill="white" stroke="#e0d6ee"/><rect x="564" y="205" width="31" height="27" rx="7" fill="#efe8fc"/><text x="579" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#8870b6">04</text><text x="564" y="260" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#665276">Sales</text><text x="564" y="290" font-family="Arial,sans-serif" font-size="11" fill="#9d88ad">Qualify &amp; propose</text><path d="M624 321v25" stroke="#cea773" stroke-width="1.2"/><rect x="554" y="346" width="141" height="32" rx="7" fill="#fbf0df" stroke="#ecdbc0"/><text x="624" y="367" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#aa8459">HUMAN APPROVAL</text><path d="M870 252H881" stroke="#a69abf" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="717" y="190" width="151" height="130" rx="16" fill="white" stroke="#e0d6ee"/><rect x="732" y="205" width="31" height="27" rx="7" fill="#efe8fc"/><text x="747" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#8870b6">05</text><text x="732" y="260" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#665276">CRM</text><text x="732" y="290" font-family="Arial,sans-serif" font-size="11" fill="#9d88ad">One shared record</text><path d="M1038 252H1049" stroke="#a69abf" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="885" y="190" width="151" height="130" rx="16" fill="white" stroke="#e0d6ee"/><rect x="900" y="205" width="31" height="27" rx="7" fill="#efe8fc"/><text x="915" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#8870b6">06</text><text x="900" y="260" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#665276">Client Success</text><text x="900" y="290" font-family="Arial,sans-serif" font-size="11" fill="#9d88ad">Welcome &amp; plan</text><path d="M1206 252H1217" stroke="#a69abf" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1053" y="190" width="151" height="130" rx="16" fill="white" stroke="#e0d6ee"/><rect x="1068" y="205" width="31" height="27" rx="7" fill="#efe8fc"/><text x="1083" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#8870b6">07</text><text x="1068" y="260" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#665276">Delivery</text><text x="1068" y="290" font-family="Arial,sans-serif" font-size="11" fill="#9d88ad">Specialist builders</text><path d="M1374 252H1385" stroke="#a69abf" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1221" y="190" width="151" height="130" rx="16" fill="white" stroke="#e0d6ee"/><rect x="1236" y="205" width="31" height="27" rx="7" fill="#efe8fc"/><text x="1251" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#8870b6">08</text><text x="1236" y="260" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#665276">Quality</text><text x="1236" y="290" font-family="Arial,sans-serif" font-size="11" fill="#9d88ad">Test &amp; refine</text><path d="M1296 321v25" stroke="#cea773" stroke-width="1.2"/><rect x="1226" y="346" width="141" height="32" rx="7" fill="#fbf0df" stroke="#ecdbc0"/><text x="1296" y="367" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#aa8459">HUMAN APPROVAL</text><path d="M1542 252H1553" stroke="#a69abf" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1389" y="190" width="151" height="130" rx="16" fill="white" stroke="#e0d6ee"/><rect x="1404" y="205" width="31" height="27" rx="7" fill="#efe8fc"/><text x="1419" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#8870b6">09</text><text x="1404" y="260" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#665276">Finance</text><text x="1404" y="290" font-family="Arial,sans-serif" font-size="11" fill="#9d88ad">Approve &amp; invoice</text><path d="M1464 321v25" stroke="#cea773" stroke-width="1.2"/><rect x="1394" y="346" width="141" height="32" rx="7" fill="#fbf0df" stroke="#ecdbc0"/><text x="1464" y="367" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#aa8459">HUMAN APPROVAL</text><path d="M1710 252H1721" stroke="#a69abf" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1557" y="190" width="151" height="130" rx="16" fill="white" stroke="#e0d6ee"/><rect x="1572" y="205" width="31" height="27" rx="7" fill="#efe8fc"/><text x="1587" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#8870b6">10</text><text x="1572" y="260" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#665276">Reporting</text><text x="1572" y="290" font-family="Arial,sans-serif" font-size="11" fill="#9d88ad">Weekly updates</text><rect x="1725" y="190" width="151" height="130" rx="16" fill="white" stroke="#e0d6ee"/><rect x="1740" y="205" width="31" height="27" rx="7" fill="#efe8fc"/><text x="1755" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#8870b6">11</text><text x="1740" y="260" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#665276">Referral</text><text x="1740" y="290" font-family="Arial,sans-serif" font-size="11" fill="#9d88ad">30 days after close</text><path d="M121 400v20H1800v-20" stroke="#bbaaCD" fill="none" stroke-width="1.4"/><rect x="679" y="404" width="562" height="32" rx="8" fill="#f8f6fc"/><text x="960" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#947ca9">Every agent → timestamped CRM history + durable action queue</text><rect x="88" y="474" width="540" height="114" rx="13" fill="white" stroke="#e0d6ee"/><text x="110" y="504" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#756085">A welcome that arrives at the right moment</text><text x="110" y="532" font-family="Arial,sans-serif" font-size="13" fill="#a08aaf">Call booked → personalized welcome PDF, immediately.</text><text x="110" y="555" font-family="Arial,sans-serif" font-size="13" fill="#a08aaf">Call notes received → selected project plan, versioned.</text><rect x="665" y="474" width="584" height="114" rx="13" fill="white" stroke="#e0d6ee"/><text x="687" y="504" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#756085">Specialists, routed by the brief</text><text x="687" y="532" font-family="Arial,sans-serif" font-size="13" fill="#a08aaf">Shopify / WooCommerce · WordPress / React / React Native</text><text x="687" y="555" font-family="Arial,sans-serif" font-size="13" fill="#a08aaf">Content writer → brand voice + SEO keywords</text><rect x="1286" y="474" width="540" height="114" rx="13" fill="white" stroke="#e0d6ee"/><text x="1308" y="504" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#756085">Autonomy, with clear boundaries</text><text x="1308" y="532" font-family="Arial,sans-serif" font-size="13" fill="#a08aaf">Warmed secondary domain · bounce-rate auto-pause</text><text x="1308" y="555" font-family="Arial,sans-serif" font-size="13" fill="#a08aaf">Human: video calls, final approvals, money &amp; legal</text><text x="960" y="635" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#b09bc0">ZANDOP AGENCY OS / SYSTEM DESIGN</text></svg>